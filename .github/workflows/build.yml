name: Gerar Shader LuminaLite V2

on:
  push:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-shader:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar repositorio
        uses: actions/checkout@v4

      - name: Criar arquivos do shader LuminaLite V2 e gerar ZIP
        run: |
          rm -rf pack
          mkdir -p pack/shaders/lib pack/shaders/lang pack/shaders/world-1 pack/shaders/world1

          cat << 'EOF' > pack/shaders/shaders.properties
          shadow.enabled=true
          clouds=off
          oldLighting=false
          oldHandLight=true

          profile.BATATA = !SHADOWS !VOLUMETRIC_LIGHT GODRAYS !LENS_FLARE REALISTIC_CLOUDS REALISTIC_WATER !AUTO_BUMP BLOOM !WAVING_FOLIAGE !AURORA VIBRANCE
          profile.LEVE = SHADOWS shadowMapResolution=512 VOLUMETRIC_LIGHT VL_STEPS=6 GODRAYS LENS_FLARE REALISTIC_CLOUDS REALISTIC_WATER !AUTO_BUMP BLOOM WAVING_FOLIAGE AURORA VIBRANCE
          profile.REALISTA = SHADOWS shadowMapResolution=1024 VOLUMETRIC_LIGHT VL_STEPS=8 GODRAYS LENS_FLARE REALISTIC_CLOUDS REALISTIC_WATER AUTO_BUMP BLOOM WAVING_FOLIAGE AURORA VIBRANCE
          profile.ULTRA = SHADOWS shadowMapResolution=2048 VOLUMETRIC_LIGHT VL_STEPS=12 GODRAYS LENS_FLARE REALISTIC_CLOUDS REALISTIC_WATER AUTO_BUMP BLOOM WAVING_FOLIAGE AURORA VIBRANCE

          screen = SHADOWS shadowMapResolution VOLUMETRIC_LIGHT VL_STEPS GODRAYS LENS_FLARE REALISTIC_CLOUDS REALISTIC_WATER AUTO_BUMP BLOOM WAVING_FOLIAGE AURORA VIBRANCE
          EOF

          cat << 'EOF' > pack/shaders/lang/pt_BR.lang
          profile.BATATA=Celular Muito Fraco (Max FPS)
          profile.LEVE=Leve (Recomendado Celular/PC Fraco)
          profile.REALISTA=Realista (Padrao)
          profile.ULTRA=Ultra Cinematografico
          option.SHADOWS=Sombras Realistas
          option.shadowMapResolution=Qualidade das Sombras
          value.shadowMapResolution.512=Baixa (Mais FPS)
          value.shadowMapResolution.1024=Media (Equilibrada)
          value.shadowMapResolution.2048=Alta (Nitida)
          option.VOLUMETRIC_LIGHT=Feixes de Luz 3D
          option.VL_STEPS=Qualidade dos Feixes 3D
          value.VL_STEPS.6=Leve (6)
          value.VL_STEPS.8=Media (8)
          value.VL_STEPS.12=Alta (12)
          option.GODRAYS=Raios de Sol (Godrays)
          option.LENS_FLARE=Reflexo de Lente (Lens Flare)
          option.REALISTIC_CLOUDS=Nuvens Realistas
          option.REALISTIC_WATER=Agua Realista + Espuma
          option.AUTO_BUMP=Relevo 3D nos Blocos
          option.BLOOM=Brilho Cinematografico (Bloom)
          option.WAVING_FOLIAGE=Vento nas Folhas e Grama
          option.AURORA=Aurora Boreal a Noite
          option.VIBRANCE=Cores Vivas
          EOF

          cp pack/shaders/lang/pt_BR.lang pack/shaders/lang/en_US.lang

          cat << 'EOF' > pack/shaders/block.properties
          block.10001 = minecraft:water water
          block.10002 = minecraft:oak_leaves minecraft:spruce_leaves minecraft:birch_leaves minecraft:jungle_leaves minecraft:acacia_leaves minecraft:dark_oak_leaves minecraft:mangrove_leaves minecraft:cherry_leaves minecraft:azalea_leaves minecraft:flowering_azalea_leaves
          block.10003 = minecraft:grass minecraft:short_grass minecraft:tall_grass minecraft:fern minecraft:large_fern minecraft:dandelion minecraft:poppy minecraft:blue_orchid minecraft:allium minecraft:azure_bluet minecraft:red_tulip minecraft:orange_tulip minecraft:white_tulip minecraft:pink_tulip minecraft:oxeye_daisy minecraft:cornflower minecraft:lily_of_the_valley minecraft:wither_rose minecraft:sunflower minecraft:lilac minecraft:rose_bush minecraft:peony minecraft:pink_petals minecraft:wheat minecraft:carrots minecraft:potatoes minecraft:beetroots minecraft:sweet_berry_bush minecraft:sugar_cane minecraft:vine minecraft:glow_lichen minecraft:oak_sapling minecraft:spruce_sapling minecraft:birch_sapling minecraft:jungle_sapling minecraft:acacia_sapling minecraft:dark_oak_sapling minecraft:cherry_sapling minecraft:mangrove_propagule minecraft:seagrass minecraft:tall_seagrass minecraft:kelp minecraft:kelp_plant minecraft:dead_bush minecraft:torchflower minecraft:pitcher_plant
          block.10004 = minecraft:torch minecraft:wall_torch minecraft:soul_torch minecraft:soul_wall_torch minecraft:lantern minecraft:soul_lantern minecraft:glowstone minecraft:sea_lantern minecraft:shroomlight minecraft:jack_o_lantern minecraft:ochre_froglight minecraft:verdant_froglight minecraft:pearlescent_froglight minecraft:campfire minecraft:soul_campfire minecraft:lava minecraft:magma_block minecraft:end_rod minecraft:beacon minecraft:redstone_lamp:lit=true minecraft:furnace:lit=true minecraft:blast_furnace:lit=true minecraft:smoker:lit=true minecraft:fire minecraft:soul_fire
          block.10005 = minecraft:diamond_ore minecraft:deepslate_diamond_ore minecraft:emerald_ore minecraft:deepslate_emerald_ore minecraft:gold_ore minecraft:deepslate_gold_ore minecraft:nether_gold_ore minecraft:redstone_ore minecraft:deepslate_redstone_ore minecraft:lapis_ore minecraft:deepslate_lapis_ore minecraft:amethyst_cluster minecraft:large_amethyst_bud minecraft:crying_obsidian minecraft:respawn_anchor minecraft:sculk_sensor minecraft:calibrated_sculk_sensor minecraft:sculk_shrieker
          EOF

          cat << 'EOF' > pack/shaders/lib/settings.glsl
          #define SHADOWS
          #define VOLUMETRIC_LIGHT
          #define GODRAYS
          #define LENS_FLARE
          #define REALISTIC_CLOUDS
          #define REALISTIC_WATER
          #define AUTO_BUMP
          #define BLOOM
          #define WAVING_FOLIAGE
          #define AURORA
          #define VIBRANCE

          #define VL_STEPS 8 // [6 8 12]

          const int shadowMapResolution = 1024; // [512 1024 2048]
          const float shadowDistance = 72.0;
          const float shadowDistanceRenderMul = 1.0;
          const float shadowIntervalSize = 2.0;
          const float sunPathRotation = -32.0;
          const float ambientOcclusionLevel = 0.72;
          EOF

          cat << 'EOF' > pack/shaders/lib/common.glsl
          vec3 safeNormalize(vec3 v) {
              float l2 = dot(v, v);
              return (l2 > 0.000001) ? v * inversesqrt(l2) : vec3(0.0, 1.0, 0.0);
          }

          vec3 srgbToLinear(vec3 c) {
              return pow(max(c, vec3(0.0001)), vec3(2.2));
          }

          vec3 linearToSRGB(vec3 c) {
              return pow(max(c, vec3(0.0001)), vec3(0.454545));
          }

          vec3 encodeHDR(vec3 x) {
              x = max(x, vec3(0.0));
              vec3 c = x / (x + vec3(1.8));
              return sqrt(max(c, vec3(0.0)));
          }

          vec3 decodeHDR(vec3 y) {
              vec3 c = clamp(y * y, vec3(0.0), vec3(0.955));
              return (c * 1.8) / (vec3(1.0) - c);
          }

          vec3 acesToneMap(vec3 x) {
              const float a = 2.51;
              const float b = 0.03;
              const float c = 2.43;
              const float d = 0.59;
              const float e = 0.14;
              return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
          }

          float linearizeDepth(float d, float n, float f) {
              return (2.0 * n * f) / max(f + n - (d * 2.0 - 1.0) * (f - n), 0.0001);
          }

          vec2 distortShadow(vec2 p) {
              float dist = length(p);
              return p / mix(1.0, dist, 0.80);
          }

          float hash21(vec2 p) {
              p = fract(p * vec2(123.34, 456.21));
              p += dot(p, p + 45.32);
              return fract(p.x * p.y);
          }

          float valueNoise(vec2 p) {
              vec2 i = floor(p);
              vec2 f = fract(p);
              f = f * f * (3.0 - 2.0 * f);
              float a = hash21(i);
              float b = hash21(i + vec2(1.0, 0.0));
              float c = hash21(i + vec2(0.0, 1.0));
              float d = hash21(i + vec2(1.0, 1.0));
              return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
          }

          float cloudFBM(vec2 p) {
              float v = 0.0;
              float amp = 0.5;
              mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
              for (int i = 0; i < 4; i++) {
                  v += amp * valueNoise(p);
                  p = rot * p * 2.05 + vec2(1.7, 9.2);
                  amp *= 0.5;
              }
              return v;
          }

          void getAtmosphere(float sunH, float rain, out vec3 zenith, out vec3 horizon, out vec3 lightCol, out vec3 ambSky) {
              float dayF = smoothstep(-0.08, 0.22, sunH);
              float sunsetF = smoothstep(-0.15, 0.04, sunH) * (1.0 - smoothstep(0.05, 0.36, sunH));

              vec3 dayZen = vec3(0.05, 0.24, 0.85);
              vec3 dayHor = vec3(0.46, 0.76, 1.12);
              vec3 setZen = vec3(0.08, 0.12, 0.42);
              vec3 setHor = vec3(1.65, 0.44, 0.10);
              vec3 nitZen = vec3(0.006, 0.014, 0.045);
              vec3 nitHor = vec3(0.020, 0.038, 0.088);

              zenith = mix(nitZen, dayZen, dayF);
              zenith = mix(zenith, setZen, sunsetF * 0.88);

              horizon = mix(nitHor, dayHor, dayF);
              horizon = mix(horizon, setHor, sunsetF * 0.95);

              vec3 rainZen = mix(vec3(0.012, 0.018, 0.030), vec3(0.16, 0.20, 0.26), dayF);
              vec3 rainHor = mix(vec3(0.025, 0.032, 0.046), vec3(0.32, 0.36, 0.42), dayF);
              zenith = mix(zenith, rainZen, rain * 0.86);
              horizon = mix(horizon, rainHor, rain * 0.86);

              vec3 sunCol = mix(vec3(2.35, 0.72, 0.18), vec3(2.15, 1.92, 1.58), smoothstep(0.0, 0.32, sunH));
              vec3 moonCol = vec3(0.24, 0.36, 0.64);
              lightCol = (sunH >= 0.0) ? sunCol : moonCol;
              lightCol *= smoothstep(0.0, 0.10, abs(sunH));
              lightCol *= (1.0 - rain * 0.76);

              ambSky = mix(zenith, horizon, 0.45);
          }

          vec3 computeSkyBase(vec3 dir, vec3 sunDir, float rain) {
              vec3 zen, hor, lCol, aSky;
              getAtmosphere(sunDir.y, rain, zen, hor, lCol, aSky);

              float up = clamp(dir.y, 0.0, 1.0);
              vec3 sky = mix(hor, zen, pow(max(up, 0.0001), 0.52));

              float below = clamp(-dir.y, 0.0, 1.0);
              sky = mix(sky, hor * 0.45, smoothstep(0.0, 0.38, below));

              float sunDot = max(dot(dir, sunDir), 0.0);
              float sunVis = smoothstep(-0.12, 0.06, sunDir.y) * (1.0 - rain * 0.90);
              vec3 glowCol = mix(vec3(1.8, 0.48, 0.10), vec3(1.4, 1.18, 0.85), smoothstep(0.0, 0.34, sunDir.y));
              sky += glowCol * pow(max(sunDot, 0.0001), 7.0) * 0.52 * sunVis;
              sky += glowCol * pow(max(sunDot, 0.0001), 85.0) * 2.4 * sunVis;
              sky += vec3(6.5, 5.6, 4.2) * smoothstep(0.9985, 0.9996, sunDot) * sunVis;

              float moonDot = max(dot(dir, -sunDir), 0.0);
              float moonVis = (1.0 - smoothstep(-0.12, 0.05, sunDir.y)) * (1.0 - rain * 0.90);
              sky += vec3(0.26, 0.42, 0.78) * pow(max(moonDot, 0.0001), 18.0) * 0.48 * moonVis;
              sky += vec3(1.8, 2.1, 2.6) * smoothstep(0.9988, 0.9996, moonDot) * moonVis;

              return sky;
          }

          vec3 computeSkyFull(vec3 dir, vec3 sunDir, float time, float rain, float allowClouds, float allowAurora) {
              vec3 sky = computeSkyBase(dir, sunDir, rain);

              float nightVis = (1.0 - smoothstep(-0.12, 0.06, sunDir.y)) * (1.0 - rain * 0.95);
              if (allowAurora > 0.5 && nightVis > 0.02 && dir.y > 0.08) {
                  vec2 aUV = dir.xz / (dir.y + 0.25);
                  float wave1 = sin(aUV.x * 2.2 + time * 0.28 + sin(aUV.y * 1.8 - time * 0.18));
                  float wave2 = sin(aUV.x * 3.8 - time * 0.22 + aUV.y * 2.4);
                  float band = exp(-abs(wave1 * 0.65 + wave2 * 0.35) * 4.5);
                  float detail = 0.5 + 0.5 * valueNoise(aUV * 3.0 + vec2(0.0, time * 0.12));
                  float mask = smoothstep(0.08, 0.38, dir.y) * smoothstep(0.92, 0.35, dir.y);
                  vec3 aCol = mix(vec3(0.08, 0.95, 0.58), vec3(0.55, 0.16, 0.95), smoothstep(0.22, 0.68, dir.y));
                  sky += aCol * band * detail * mask * nightVis * 0.42;
              }

              if (allowClouds > 0.5 && dir.y > 0.02) {
                  vec3 zen, hor, lCol, aSky;
                  getAtmosphere(sunDir.y, rain, zen, hor, lCol, aSky);

                  vec2 cUV = (dir.xz / (dir.y + 0.15)) * 1.35 + vec2(time * 0.014, time * 0.007);
                  float d1 = cloudFBM(cUV);
                  float dSun = cloudFBM(cUV + sunDir.xz * 0.14);

                  float cov = mix(0.47, 0.26, rain);
                  float alpha = smoothstep(cov, cov + 0.25, d1);

                  float lightTerm = clamp((d1 - dSun) * 2.4 + 0.55, 0.15, 1.0);
                  float silver = pow(max(dot(dir, sunDir), 0.0001), 10.0) * (1.0 - alpha * 0.4);
                  float dayF = smoothstep(-0.08, 0.22, sunDir.y);
                  float sunsetF = smoothstep(-0.14, 0.04, sunDir.y) * (1.0 - smoothstep(0.05, 0.35, sunDir.y));

                  vec3 cBright = mix(vec3(0.16, 0.24, 0.42), vec3(1.95, 1.88, 1.78), dayF);
                  cBright = mix(cBright, vec3(2.4, 0.85, 0.32), sunsetF * 0.92);
                  cBright = mix(cBright, vec3(0.42, 0.46, 0.52) * max(dayF, 0.18), rain * 0.85);

                  vec3 cDark = mix(vec3(0.02, 0.035, 0.075), vec3(0.32, 0.46, 0.68), dayF);
                  cDark = mix(cDark, vec3(0.34, 0.20, 0.32), sunsetF * 0.85);
                  cDark = mix(cDark, vec3(0.10, 0.12, 0.16) * max(dayF, 0.2), rain * 0.85);

                  vec3 cloudCol = mix(cDark, cBright, lightTerm);
                  cloudCol += lCol * silver * 0.65 * (1.0 - rain * 0.8);

                  float horFade = smoothstep(0.02, 0.22, dir.y);
                  sky = mix(sky, cloudCol, alpha * horFade * 0.92);
              }

              return sky;
          }

          vec3 getWaveOffset(vec3 absPos, float time, float rain, float strength) {
              float speed = 2.2 + rain * 2.0;
              float amp = (0.055 + rain * 0.05) * strength;
              float phase = absPos.x * 0.9 + absPos.z * 0.75 + absPos.y * 0.5;
              float wx = sin(time * speed + phase) * amp;
              float wz = cos(time * speed * 0.85 + phase * 1.15) * amp * 0.85;
              return vec3(wx, 0.0, wz);
          }
          EOF

          cat << 'EOF' > pack/shaders/shadow.vsh
          #version 120
          #include "/lib/settings.glsl"
          #include "/lib/common.glsl"

          attribute vec4 mc_Entity;
          uniform mat4 shadowModelView;
          uniform mat4 shadowModelViewInverse;
          uniform vec3 cameraPosition;
          uniform float frameTimeCounter;
          uniform float rainStrength;

          varying vec2 vTexcoord;

          void main() {
              vTexcoord = (gl_TextureMatrix[0] * gl_MultiTexCoord0).xy;
          #ifndef SHADOWS
              gl_Position = vec4(10.0, 10.0, 10.0, 1.0);
              return;
          #endif
              int blockId = int(mc_Entity.x + 0.5);
              if (blockId == 10001) {
                  gl_Position = vec4(10.0, 10.0, 10.0, 1.0);
                  return;
              }
              vec4 worldPos = shadowModelViewInverse * (gl_ModelViewMatrix * gl_Vertex);
          #ifdef WAVING_FOLIAGE
              if (blockId == 10002 || blockId == 10003) {
                  float str = (blockId == 10002) ? 0.65 : 1.0;
                  worldPos.xyz += getWaveOffset(worldPos.xyz + cameraPosition, frameTimeCounter, rainStrength, str);
              }
          #endif
              gl_Position = gl_ProjectionMatrix * (shadowModelView * worldPos);
              gl_Position.xy = distortShadow(gl_Position.xy);
              gl_Position.z *= 0.5;
          }
          EOF

          cat << 'EOF' > pack/shaders/shadow.fsh
          #version 120
          uniform sampler2D texture;
          varying vec2 vTexcoord;

          void main() {
              if (texture2D(texture, vTexcoord).a < 0.1) discard;
              gl_FragColor = vec4(1.0);
          }
          EOF

          cat << 'EOF' > pack/shaders/gbuffers_skybasic.vsh
          #version 120
          varying vec3 vViewPos;

          void main() {
              vec4 vp = gl_ModelViewMatrix * gl_Vertex;
              vViewPos = vp.xyz;
              gl_Position = gl_ProjectionMatrix * vp;
          }
          EOF

          cat << 'EOF' > pack/shaders/gbuffers_skybasic.fsh
          #version 120
          #include "/lib/settings.glsl"
          #include "/lib/common.glsl"

          /* DRAWBUFFERS:0 */
          uniform mat4 gbufferModelViewInverse;
          uniform vec3 sunPosition;
          uniform float rainStrength;
          uniform float frameTimeCounter;

          varying vec3 vViewPos;

          float hash31(vec3 p) {
              p = fract(p * 0.1031);
              p += dot(p, p.yzx + 33.33);
              return fract((p.x + p.y) * p.z);
          }

          void main() {
              vec3 worldDir = safeNormalize((gbufferModelViewInverse * vec4(vViewPos, 0.0)).xyz);
              vec3 sunDir = safeNormalize((gbufferModelViewInverse * vec4(sunPosition, 0.0)).xyz);

              float cloudsOn = 0.0;
          #ifdef REALISTIC_CLOUDS
              cloudsOn = 1.0;
          #endif
              float auroraOn = 0.0;
          #ifdef AURORA
              auroraOn = 1.0;
          #endif

              vec3 col = computeSkyFull(worldDir, sunDir, frameTimeCounter, rainStrength, cloudsOn, auroraOn);

              float nightVis = (1.0 - smoothstep(-0.14, 0.05, sunDir.y)) * (1.0 - rainStrength);
              if (nightVis > 0.01 && worldDir.y > 0.02) {
                  vec3 grid = floor(worldDir * 230.0);
                  float rnd = hash31(grid);
                  if (rnd > 0.992) {
                      float twinkle = 0.55 + 0.45 * sin(frameTimeCounter * 2.8 + rnd * 700.0);
                      float hFade = smoothstep(0.02, 0.25, worldDir.y);
                      vec3 starTint = mix(vec3(0.75, 0.88, 1.0), vec3(1.0, 0.86, 0.72), fract(rnd * 97.3));
                      col += starTint * twinkle * hFade * nightVis * 2.2;
                  }
              }

              gl_FragColor = vec4(encodeHDR(col), 1.0);
          }
          EOF

          cat << 'EOF' > pack/shaders/gbuffers_skytextured.vsh
          #version 120
          varying vec2 vTexcoord;
          varying vec4 vColor;

          void main() {
              vTexcoord = (gl_TextureMatrix[0] * gl_MultiTexCoord0).xy;
              vColor = gl_Color;
              gl_Position = ftransform();
          }
          EOF

          cat << 'EOF' > pack/shaders/gbuffers_skytextured.fsh
          #version 120
          /* DRAWBUFFERS:0 */
          uniform sampler2D texture;
          uniform float rainStrength;
          varying vec2 vTexcoord;
          varying vec4 vColor;

          void main() {
              vec4 tex = texture2D(texture, vTexcoord) * vColor;
              tex.rgb *= (0.75 * (1.0 - rainStrength * 0.9));
              gl_FragColor = tex;
          }
          EOF

          cat << 'EOF' > pack/shaders/gbuffers_terrain.vsh
          #version 120
          #include "/lib/settings.glsl"
          #include "/lib/common.glsl"

          attribute vec4 mc_Entity;
          uniform mat4 gbufferModelView;
          uniform mat4 gbufferModelViewInverse;
          uniform mat4 shadowModelView;
          uniform mat4 shadowProjection;
          uniform vec3 cameraPosition;
          uniform float frameTimeCounter;
          uniform float rainStrength;

          varying vec2 vTexcoord;
          varying vec2 vLightmap;
          varying vec4 vColor;
          varying vec3 vWorldNormal;
          varying vec3 vViewPos;
          varying vec3 vWorldPos;
          varying vec3 vShadowClip;
          varying float vBlockType;

          void main() {
              vTexcoord = (gl_TextureMatrix[0] * gl_MultiTexCoord0).xy;
              vLightmap = (gl_TextureMatrix[1] * gl_MultiTexCoord1).xy;
              vColor = gl_Color;

              vec3 viewNormal = safeNormalize(gl_NormalMatrix * gl_Normal);
              vWorldNormal = safeNormalize(mat3(gbufferModelViewInverse) * viewNormal);

              vec4 viewPos = gl_ModelViewMatrix * gl_Vertex;
              vec4 worldPos = gbufferModelViewInverse * viewPos;

              int blockId = int(mc_Entity.x + 0.5);
              vBlockType = 0.0;
              if (blockId == 10002 || blockId == 10003) {
                  vBlockType = 1.0;
          #ifdef WAVING_FOLIAGE
                  float str = (blockId == 10002) ? 0.65 : 1.0;
                  worldPos.xyz += getWaveOffset(worldPos.xyz + cameraPosition, frameTimeCounter, rainStrength, str);
                  viewPos = gbufferModelView * worldPos;
          #endif
              } else if (blockId == 10004) {
                  vBlockType = 2.0;
              } else if (blockId == 10005) {
                  vBlockType = 3.0;
              }

              vViewPos = viewPos.xyz;
              vWorldPos = worldPos.xyz;

          #ifdef SHADOWS
              vec4 shWorld = vec4(worldPos.xyz + vWorldNormal * 0.08, 1.0);
              vec4 shClip = shadowProjection * (shadowModelView * shWorld);
              vShadowClip = shClip.xyz / max(abs(shClip.w), 0.0001);
          #else
              vShadowClip = vec3(0.0);
          #endif

              gl_Position = gl_ProjectionMatrix * viewPos;
          }
          EOF

          cat << 'EOF' > pack/shaders/gbuffers_terrain.fsh
          #version 120
          #include "/lib/settings.glsl"
          #include "/lib/common.glsl"

          /* DRAWBUFFERS:0 */
          uniform sampler2D texture;
          uniform sampler2D shadowtex0;
          uniform mat4 gbufferModelViewInverse;
          uniform vec3 sunPosition;
          uniform vec3 shadowLightPosition;
          uniform vec3 cameraPosition;
          uniform float frameTimeCounter;
          uniform float rainStrength;
          uniform int isEyeInWater;
          uniform float far;
          uniform float nightVision;
          uniform int heldBlockLightValue;
          uniform int heldBlockLightValue2;

          varying vec2 vTexcoord;
          varying vec2 vLightmap;
          varying vec4 vColor;
          varying vec3 vWorldNormal;
          varying vec3 vViewPos;
          varying vec3 vWorldPos;
          varying vec3 vShadowClip;
          varying float vBlockType;

          #ifdef SHADOWS
          float getShadow(vec3 sClip, float NdotL) {
              float edgeDist = max(abs(sClip.x), abs(sClip.y));
              if (edgeDist >= 0.995) return 1.0;
              vec2 uv = distortShadow(sClip.xy) * 0.5 + 0.5;
              float depth = (sClip.z * 0.5) * 0.5 + 0.5;
              if (depth <= 0.001 || depth >= 0.999) return 1.0;

              float bias = 0.0007 + 0.0014 * (1.0 - max(NdotL, 0.0));
              float off = 1.25 / float(shadowMapResolution);
              float lit = 0.0;
              lit += step(depth - bias, texture2D(shadowtex0, uv + vec2( off,  off)).r);
