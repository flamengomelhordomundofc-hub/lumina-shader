          uniform mat4 gbufferProjectionInverse;
          uniform mat4 gbufferModelViewInverse;
          uniform mat4 shadowModelView;
          uniform mat4 shadowProjection;
          uniform vec3 sunPosition;
          uniform vec3 shadowLightPosition;
          uniform vec3 cameraPosition;
          uniform float rainStrength;
          uniform float viewWidth;
          uniform float viewHeight;
          uniform int isEyeInWater;
          uniform ivec2 eyeBrightnessSmooth;

          varying vec2 vTexcoord;

          void main() {
              vec3 color = decodeHDR(texture2D(colortex0, vTexcoord).rgb);
              float depth = texture2D(depthtex0, vTexcoord).r;

              vec3 sunDir = safeNormalize((gbufferModelViewInverse * vec4(sunPosition, 0.0)).xyz);
              vec3 lightDir = safeNormalize((gbufferModelViewInverse * vec4(shadowLightPosition, 0.0)).xyz);
              vec3 zen, hor, lCol, aSky;
              getAtmosphere(sunDir.y, rainStrength, zen, hor, lCol, aSky);

              float ign = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));

          #if defined(VOLUMETRIC_LIGHT) && defined(SHADOWS)
              if (isEyeInWater == 0 && rainStrength < 0.92) {
                  vec3 ndcPos = vec3(vTexcoord, depth) * 2.0 - 1.0;
                  vec4 viewPosH = gbufferProjectionInverse * vec4(ndcPos, 1.0);
                  vec3 viewPos = viewPosH.xyz / max(abs(viewPosH.w), 0.0001);

                  vec3 worldStart = (gbufferModelViewInverse * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
                  vec3 worldEnd = (gbufferModelViewInverse * vec4(viewPos, 1.0)).xyz;
                  vec3 rayVec = worldEnd - worldStart;
                  float rayLen = length(rayVec);
                  vec3 rayDir = rayVec / max(rayLen, 0.0001);
                  float marchDist = min(rayLen, 66.0);

                  float cosTheta = dot(rayDir, lightDir);
                  float g = 0.66;
                  float phase = (1.0 - g * g) / max(pow(1.0 + g * g - 2.0 * g * cosTheta, 1.5), 0.05);
                  phase = clamp(phase * 0.24 + 0.14, 0.10, 2.4);

                  float vlSum = 0.0;
                  for (int i = 0; i < VL_STEPS; i++) {
                      float t = (float(i) + ign) / float(VL_STEPS);
                      float dStep = marchDist * mix(t, t * t, 0.35);
                      vec3 sp = worldStart + rayDir * dStep;
                      vec4 shClip = shadowProjection * (shadowModelView * vec4(sp, 1.0));
                      vec3 shPos = shClip.xyz / max(abs(shClip.w), 0.0001);

                      float lit = 1.0;
                      if (abs(shPos.x) < 0.99 && abs(shPos.y) < 0.99) {
                          vec2 shUV = distortShadow(shPos.xy) * 0.5 + 0.5;
                          float shDepth = (shPos.z * 0.5) * 0.5 + 0.5;
                          lit = step(shDepth - 0.001, texture2D(shadowtex0, shUV).r);
                      }
                      float hDens = exp(-max((sp.y + cameraPosition.y) - 62.0, 0.0) * 0.014);
                      vlSum += lit * (0.45 + 0.55 * hDens);
                  }
                  vlSum /= float(VL_STEPS);

                  float sunsetBoost = 1.0 + 1.15 * smoothstep(-0.08, 0.05, sunDir.y) * (1.0 - smoothstep(0.05, 0.35, sunDir.y));
                  float distF = clamp(marchDist / 48.0, 0.0, 1.0);
                  float eyeSky = clamp(float(eyeBrightnessSmooth.y) / 240.0, 0.0, 1.0);
                  float shaftStr = (0.45 + 0.55 * eyeSky) * (1.0 - rainStrength * 0.8) * sunsetBoost;
                  color += lCol * vlSum * phase * distF * shaftStr * 0.36;
              }
          #endif

          #if defined(GODRAYS) || defined(LENS_FLARE)
              float sunVis = smoothstep(-0.06, 0.12, sunDir.y) * (1.0 - rainStrength * 0.92);
              if (sunVis > 0.01 && sunPosition.z < -0.5) {
                  vec4 sunClip = gbufferProjection * vec4(sunPosition, 1.0);
                  if (sunClip.w > 0.001) {
                      vec2 sunUV = (sunClip.xy / sunClip.w) * 0.5 + 0.5;
                      float aspect = viewWidth / max(viewHeight, 1.0);

          #ifdef GODRAYS
                      float screenFade = 1.0 - smoothstep(0.15, 1.35, length((sunUV - vec2(0.5)) * vec2(aspect, 1.0)));
                      if (screenFade > 0.01) {
                          vec2 delta = (sunUV - vTexcoord) * (0.90 / 14.0);
                          vec2 rayUV = vTexcoord + delta * ign;
                          float rays = 0.0;
                          float decay = 1.0;
                          for (int j = 0; j < 14; j++) {
                              rayUV += delta;
                              if (rayUV.x > 0.0 && rayUV.x < 1.0 && rayUV.y > 0.0 && rayUV.y < 1.0) {
                                  float d = texture2D(depthtex0, rayUV).r;
                                  rays += smoothstep(0.9985, 0.9999, d) * decay;
                              }
                              decay *= 0.88;
                          }
                          vec3 rayCol = mix(vec3(1.85, 0.62, 0.16), vec3(1.45, 1.25, 0.88), smoothstep(0.0, 0.34, sunDir.y));
                          color += rayCol * (rays * 0.095) * sunVis * screenFade;
                      }
          #endif

          #ifdef LENS_FLARE
                      if (sunUV.x > 0.0 && sunUV.x < 1.0 && sunUV.y > 0.0 && sunUV.y < 1.0 && isEyeInWater == 0) {
                          float sunUnoccluded = smoothstep(0.9985, 0.9999, texture2D(depthtex0, sunUV).r);
                          if (sunUnoccluded > 0.01) {
                              vec2 uvA = (vTexcoord - vec2(0.5)) * vec2(aspect, 1.0);
                              vec2 sunA = (sunUV - vec2(0.5)) * vec2(aspect, 1.0);
                              vec2 diff = uvA - sunA;

                              float streak = exp(-abs(diff.y) * 58.0) * exp(-abs(diff.x) * 3.8);
                              vec3 flare = vec3(1.4, 1.05, 0.65) * streak * 0.55;

                              float g1 = max(0.0, 1.0 - length(uvA + sunA * 0.45) * 9.5);
                              float g2 = max(0.0, 1.0 - length(uvA + sunA * 0.85) * 14.0);
                              float g3 = max(0.0, 1.0 - length(uvA - sunA * 0.35) * 12.0);
                              float ring = smoothstep(0.18, 0.21, length(uvA + sunA * 0.65)) * (1.0 - smoothstep(0.21, 0.25, length(uvA + sunA * 0.65)));

                              flare += vec3(0.45, 0.85, 1.2) * (g1 * g1) * 0.22;
                              flare += vec3(1.3, 0.68, 0.28) * (g2 * g2) * 0.28;
                              flare += vec3(0.95, 1.1, 0.55) * (g3 * g3) * 0.16;
                              flare += vec3(0.85, 0.72, 1.15) * ring * 0.18;

                              color += flare * sunVis * sunUnoccluded;
                          }
                      }
          #endif
                  }
              }
          #endif

              gl_FragColor = vec4(encodeHDR(color), 1.0);
          }
          EOF

          cat << 'EOF' > pack/shaders/final.vsh
          #version 120
          varying vec2 vTexcoord;

          void main() {
              vTexcoord = (gl_TextureMatrix[0] * gl_MultiTexCoord0).xy;
              gl_Position = ftransform();
          }
          EOF

          cat << 'EOF' > pack/shaders/final.fsh
          #version 120
          #include "/lib/settings.glsl"
          #include "/lib/common.glsl"

          uniform sampler2D colortex0;
          uniform sampler2D depthtex0;
          uniform float viewWidth;
          uniform float viewHeight;
          uniform float frameTimeCounter;
          uniform int isEyeInWater;
          uniform float near;
          uniform float far;

          varying vec2 vTexcoord;

          vec3 sampleBloom(vec2 uv) {
              vec3 c = decodeHDR(texture2D(colortex0, clamp(uv, 0.001, 0.999)).rgb);
              return max(c - vec3(1.05), vec3(0.0));
          }

          void main() {
              vec2 uv = vTexcoord;

              if (isEyeInWater == 1) {
                  uv.x += sin(uv.y * 19.0 + frameTimeCounter * 3.2) * 0.0032;
                  uv.y += cos(uv.x * 17.0 + frameTimeCounter * 2.6) * 0.0032;
                  uv = clamp(uv, 0.002, 0.998);
              }

              vec3 color = decodeHDR(texture2D(colortex0, uv).rgb);
              vec2 px = vec2(1.0 / max(viewWidth, 1.0), 1.0 / max(viewHeight, 1.0));

          #ifdef BLOOM
              vec3 b1 = vec3(0.0);
              vec2 r1 = px * 4.0;
              b1 += sampleBloom(uv + vec2( r1.x,  r1.y));
              b1 += sampleBloom(uv + vec2(-r1.x,  r1.y));
              b1 += sampleBloom(uv + vec2( r1.x, -r1.y));
              b1 += sampleBloom(uv + vec2(-r1.x, -r1.y));

              vec3 b2 = vec3(0.0);
              vec2 r2 = px * 11.0;
              b2 += sampleBloom(uv + vec2( r2.x,  0.0 ));
              b2 += sampleBloom(uv + vec2(-r2.x,  0.0 ));
              b2 += sampleBloom(uv + vec2( 0.0,   r2.y));
              b2 += sampleBloom(uv + vec2( 0.0,  -r2.y));

              vec3 b3 = vec3(0.0);
              vec2 r3 = px * 24.0;
              b3 += sampleBloom(uv + vec2( r3.x,  r3.y));
              b3 += sampleBloom(uv + vec2(-r3.x,  r3.y));
              b3 += sampleBloom(uv + vec2( r3.x, -r3.y));
              b3 += sampleBloom(uv + vec2(-r3.x, -r3.y));

              vec3 b4 = vec3(0.0);
              vec2 r4 = px * 42.0;
              b4 += sampleBloom(uv + vec2( r4.x,  0.0 ));
              b4 += sampleBloom(uv + vec2(-r4.x,  0.0 ));
              b4 += sampleBloom(uv + vec2( 0.0,   r4.y));
              b4 += sampleBloom(uv + vec2( 0.0,  -r4.y));

              vec3 bloom = (b1 * 0.36 + b2 * 0.28 + b3 * 0.22 + b4 * 0.14) * 0.11;
              color += bloom;
          #endif

              if (isEyeInWater == 1) {
                  float depth = linearizeDepth(texture2D(depthtex0, uv).r, near, far);
                  float waterFog = clamp(1.0 - exp(-depth * 0.052), 0.0, 0.90);
                  color = mix(color, vec3(0.02, 0.22, 0.36), waterFog);
              }

              color = acesToneMap(color * 1.06);
              color = linearToSRGB(color);

          #ifdef VIBRANCE
              float luma = dot(color, vec3(0.2126, 0.7152, 0.0722));
              float maxC = max(color.r, max(color.g, color.b));
              float minC = min(color.r, min(color.g, color.b));
              float sat = maxC - minC;
              color = mix(vec3(luma), color, 1.0 + (1.0 - sat) * 0.30);
              color = clamp((color - 0.5) * 1.05 + 0.5, 0.0, 1.0);
          #endif

              vec2 vp = vTexcoord - vec2(0.5);
              float vig = 1.0 - dot(vp, vp) * 0.38;
              color *= clamp(vig, 0.76, 1.0);

              gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
          }
          EOF

          cat << 'EOF' > pack/shaders/world-1/gbuffers_terrain.vsh
          #version 120
          #include "/lib/common.glsl"
          uniform mat4 gbufferModelViewInverse;
          varying vec2 vTexcoord;
          varying vec2 vLightmap;
          varying vec4 vColor;
          varying vec3 vNormal;
          varying vec3 vViewPos;

          void main() {
              vTexcoord = (gl_TextureMatrix[0] * gl_MultiTexCoord0).xy;
              vLightmap = (gl_TextureMatrix[1] * gl_MultiTexCoord1).xy;
              vColor = gl_Color;
              vNormal = safeNormalize(mat3(gbufferModelViewInverse) * (gl_NormalMatrix * gl_Normal));
              vec4 vp = gl_ModelViewMatrix * gl_Vertex;
              vViewPos = vp.xyz;
              gl_Position = gl_ProjectionMatrix * vp;
          }
          EOF

          cat << 'EOF' > pack/shaders/world-1/gbuffers_terrain.fsh
          #version 120
          #include "/lib/common.glsl"
          /* DRAWBUFFERS:0 */
          uniform sampler2D texture;
          uniform vec3 fogColor;
          uniform float far;
          uniform int heldBlockLightValue;
          uniform int heldBlockLightValue2;

          varying vec2 vTexcoord;
          varying vec2 vLightmap;
          varying vec4 vColor;
          varying vec3 vNormal;
          varying vec3 vViewPos;

          void main() {
              vec4 tex = texture2D(texture, vTexcoord) * vColor;
              if (tex.a < 0.1) discard;
              vec3 albedo = srgbToLinear(tex.rgb);
              float dist = length(vViewPos);
              float torch = clamp((vLightmap.x - 0.03125) / 0.9375, 0.0, 1.0);
              float held = max(float(heldBlockLightValue), float(heldBlockLightValue2)) / 15.0;
              torch = max(torch, max(0.0, held - dist / 15.0));

              float shade = 0.68 + 0.32 * (vNormal.y * 0.5 + 0.5);
              vec3 amb = mix(vec3(0.28, 0.08, 0.04), srgbToLinear(fogColor) * 0.9, 0.55) * shade;
              vec3 light = amb + vec3(1.5, 0.58, 0.18) * pow(max(torch, 0.0001), 2.1) * 2.6;
              vec3 col = albedo * light;
              float fogF = smoothstep(far * 0.22, far * 0.90, dist);
              col = mix(col, srgbToLinear(fogColor) * 0.72, fogF);
              gl_FragColor = vec4(encodeHDR(col), tex.a);
          }
          EOF

          cp pack/shaders/composite.vsh pack/shaders/world-1/composite.vsh
          cat << 'EOF' > pack/shaders/world-1/composite.fsh
          #version 120
          /* DRAWBUFFERS:0 */
          uniform sampler2D colortex0;
          varying vec2 vTexcoord;
          void main() {
              gl_FragColor = texture2D(colortex0, vTexcoord);
          }
          EOF

          cp pack/shaders/final.vsh pack/shaders/world-1/final.vsh
          cp pack/shaders/final.fsh pack/shaders/world-1/final.fsh

          cp pack/shaders/world-1/gbuffers_terrain.vsh pack/shaders/world1/gbuffers_terrain.vsh
          cat << 'EOF' > pack/shaders/world1/gbuffers_terrain.fsh
          #version 120
          #include "/lib/common.glsl"
          /* DRAWBUFFERS:0 */
          uniform sampler2D texture;
          uniform float far;
          uniform int heldBlockLightValue;
          uniform int heldBlockLightValue2;

          varying vec2 vTexcoord;
          varying vec2 vLightmap;
          varying vec4 vColor;
          varying vec3 vNormal;
          varying vec3 vViewPos;

          void main() {
              vec4 tex = texture2D(texture, vTexcoord) * vColor;
              if (tex.a < 0.1) discard;
              vec3 albedo = srgbToLinear(tex.rgb);
              float dist = length(vViewPos);
              float torch = clamp((vLightmap.x - 0.03125) / 0.9375, 0.0, 1.0);
              float held = max(float(heldBlockLightValue), float(heldBlockLightValue2)) / 15.0;
              torch = max(torch, max(0.0, held - dist / 15.0));

              float shade = 0.65 + 0.35 * (vNormal.y * 0.5 + 0.5);
              vec3 amb = vec3(0.22, 0.14, 0.36) * shade;
              vec3 light = amb + vec3(1.1, 0.68, 1.4) * pow(max(torch, 0.0001), 2.1) * 2.2;
              vec3 col = albedo * light;
              float fogF = smoothstep(far * 0.42, far * 0.96, dist);
              col = mix(col, vec3(0.06, 0.03, 0.12), fogF);
              gl_FragColor = vec4(encodeHDR(col), tex.a);
          }
          EOF

          cp pack/shaders/world-1/composite.vsh pack/shaders/world1/composite.vsh
          cp pack/shaders/world-1/composite.fsh pack/shaders/world1/composite.fsh
          cp pack/shaders/final.vsh pack/shaders/world1/final.vsh
          cp pack/shaders/final.fsh pack/shaders/world1/final.fsh

          cd pack
          zip -r ../LuminaLite-V2-Realista-1.20.1.zip shaders/
          cd ..

      - name: Salvar ZIP V2 na pagina inicial
        run: |
          rm -f LuminaLite-Realista-1.20.1.zip
          git config user.name "LuminaLite Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Shader LuminaLite V2 Ultra-Realista 1.20.1"
            git push
          fi

      - name: Publicar ZIP V2 na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v2 LuminaLite-V2-Realista-1.20.1.zip --clobber || gh release create v2 LuminaLite-V2-Realista-1.20.1.zip --title "LuminaLite V2 Ultra-Realista 1.20.1" --notes "Toque em LuminaLite-V2-Realista-1.20.1.zip para baixar e mova direto para shaderpacks!"
