          #include "/lib/settings.glsl"
          #include "/lib/common.glsl"

          uniform sampler2D colortex0;
          uniform sampler2D depthtex0;
          uniform mat4 gbufferModelViewInverse;
          uniform vec3 sunPosition;
          uniform float viewWidth;
          uniform float viewHeight;
          uniform float frameTimeCounter;
          uniform int isEyeInWater;
          uniform float near;
          uniform float far;

          varying vec2 vTexcoord;

          float linearDepth(float d) {
              return (2.0 * near * far) / max(far + near - (d * 2.0 - 1.0) * (far - near), 0.0001);
          }

          void main() {
              vec2 uv = vTexcoord;

              if (isEyeInWater == 1) {
                  uv.x += sin(uv.y * 16.0 + frameTimeCounter * 2.8) * 0.0025;
                  uv.y += cos(uv.x * 14.0 + frameTimeCounter * 2.4) * 0.0025;
                  uv = clamp(uv, 0.002, 0.998);
              }

              vec4 center = texture2D(colortex0, uv);
              vec3 color = center.rgb;
              float smoothShaft = center.a * 2.0;
              vec3 bloom = vec3(0.0);

              vec2 px = vec2(1.0 / max(viewWidth, 1.0), 1.0 / max(viewHeight, 1.0));
              vec2 r1 = px * 2.8;
              vec2 r2 = px * 7.5;

              vec4 s1 = texture2D(colortex0, clamp(uv + vec2( r1.x,  r1.y), 0.0, 1.0));
              vec4 s2 = texture2D(colortex0, clamp(uv + vec2(-r1.x,  r1.y), 0.0, 1.0));
              vec4 s3 = texture2D(colortex0, clamp(uv + vec2( r1.x, -r1.y), 0.0, 1.0));
              vec4 s4 = texture2D(colortex0, clamp(uv + vec2(-r1.x, -r1.y), 0.0, 1.0));
              vec4 s5 = texture2D(colortex0, clamp(uv + vec2( r2.x,  0.0 ), 0.0, 1.0));
              vec4 s6 = texture2D(colortex0, clamp(uv + vec2(-r2.x,  0.0 ), 0.0, 1.0));
              vec4 s7 = texture2D(colortex0, clamp(uv + vec2( 0.0,   r2.y), 0.0, 1.0));
              vec4 s8 = texture2D(colortex0, clamp(uv + vec2( 0.0,  -r2.y), 0.0, 1.0));

              smoothShaft = (smoothShaft + s1.a + s2.a + s3.a + s4.a + s5.a + s6.a + s7.a + s8.a) / 10.0;

          #ifdef BLOOM
              bloom += max(s1.rgb - 0.80, 0.0) + max(s2.rgb - 0.80, 0.0) + max(s3.rgb - 0.80, 0.0) + max(s4.rgb - 0.80, 0.0);
              bloom += max(s5.rgb - 0.80, 0.0) + max(s6.rgb - 0.80, 0.0) + max(s7.rgb - 0.80, 0.0) + max(s8.rgb - 0.80, 0.0);
              color += bloom * 0.18 * (1.0 - color * 0.55);
          #endif

              if (smoothShaft > 0.002 && isEyeInWater == 0) {
                  vec3 sunDir = safeNormalize((gbufferModelViewInverse * vec4(sunPosition, 0.0)).xyz);
                  vec3 shaftCol = mix(vec3(1.0, 0.54, 0.18), vec3(1.0, 0.90, 0.68), smoothstep(0.0, 0.35, sunDir.y));
                  color += shaftCol * smoothShaft * 0.65 * (1.0 - color * 0.72);
              }

              if (isEyeInWater == 1) {
                  float depth = linearDepth(texture2D(depthtex0, uv).r);
                  float wFog = clamp(1.0 - exp(-depth * 0.045), 0.0, 0.84);
                  color = mix(color, vec3(0.05, 0.30, 0.42), wFog);
              }

          #ifdef VIBRANCE
              float luma = dot(color, vec3(0.2126, 0.7152, 0.0722));
              float maxC = max(color.r, max(color.g, color.b));
              float minC = min(color.r, min(color.g, color.b));
              float sat = maxC - minC;
              color = mix(vec3(luma), color, 1.0 + (1.0 - sat) * 0.24);
              color = clamp((color - 0.5) * 1.05 + 0.5, 0.0, 1.0);
          #endif

              vec2 vp = vTexcoord - vec2(0.5);
              float vig = 1.0 - dot(vp, vp) * 0.28;
              color *= clamp(vig, 0.82, 1.0);

              gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
          }
          EOF

          cat << 'EOF' > pack/shaders/world-1/gbuffers_terrain.vsh
          #version 120
          #include "/lib/common.glsl"
          uniform mat4 gbufferModelViewInverse;
          varying vec2 vTexcoord;
          varying vec2 vLightmap;
          varying vec4 vColor;
          varying vec3 vNormal;
          varying vec3 vViewPos;

          void main() {
              vTexcoord = (gl_TextureMatrix[0] * gl_MultiTexCoord0).xy;
              vLightmap = (gl_TextureMatrix[1] * gl_MultiTexCoord1).xy;
              vColor = gl_Color;
              vNormal = safeNormalize(mat3(gbufferModelViewInverse) * (gl_NormalMatrix * gl_Normal));
              vec4 vp = gl_ModelViewMatrix * gl_Vertex;
              vViewPos = vp.xyz;
              gl_Position = gl_ProjectionMatrix * vp;
          }
          EOF

          cat << 'EOF' > pack/shaders/world-1/gbuffers_terrain.fsh
          #version 120
          #include "/lib/common.glsl"
          /* DRAWBUFFERS:0 */
          uniform sampler2D texture;
          uniform vec3 fogColor;
          uniform float far;
          uniform int heldBlockLightValue;
          uniform int heldBlockLightValue2;

          varying vec2 vTexcoord;
          varying vec2 vLightmap;
          varying vec4 vColor;
          varying vec3 vNormal;
          varying vec3 vViewPos;

          void main() {
              vec4 tex = texture2D(texture, vTexcoord) * vColor;
              if (tex.a < 0.1) discard;
              vec3 albedo = toLinear(tex.rgb);
              float dist = length(vViewPos);
              float torch = clamp((vLightmap.x - 0.03125) / 0.9375, 0.0, 1.0);
              float held = max(float(heldBlockLightValue), float(heldBlockLightValue2)) / 15.0;
              torch = max(torch, max(0.0, held - dist / 14.0));

              float shade = 0.70 + 0.30 * (vNormal.y * 0.5 + 0.5);
              vec3 amb = mix(vec3(0.24, 0.08, 0.04), toLinear(fogColor) * 0.85, 0.55) * shade;
              vec3 light = amb + vec3(1.2, 0.52, 0.18) * pow(max(torch, 0.0001), 2.1) * 2.1;
              vec3 col = albedo * light;
              float fogF = smoothstep(far * 0.25, far * 0.92, dist);
              col = mix(col, toLinear(fogColor) * 0.65, fogF);
              gl_FragColor = vec4(toSRGB(filmicToneMap(col)), tex.a);
          }
          EOF

          cp pack/shaders/composite.vsh pack/shaders/world-1/composite.vsh
          cat << 'EOF' > pack/shaders/world-1/composite.fsh
          #version 120
          /* DRAWBUFFERS:0 */
          uniform sampler2D colortex0;
          varying vec2 vTexcoord;
          void main() {
              gl_FragColor = vec4(texture2D(colortex0, vTexcoord).rgb, 0.0);
          }
          EOF

          cp pack/shaders/final.vsh pack/shaders/world-1/final.vsh
          cp pack/shaders/final.fsh pack/shaders/world-1/final.fsh

          cp pack/shaders/world-1/gbuffers_terrain.vsh pack/shaders/world1/gbuffers_terrain.vsh
          cat << 'EOF' > pack/shaders/world1/gbuffers_terrain.fsh
          #version 120
          #include "/lib/common.glsl"
          /* DRAWBUFFERS:0 */
          uniform sampler2D texture;
          uniform float far;
          uniform int heldBlockLightValue;
          uniform int heldBlockLightValue2;

          varying vec2 vTexcoord;
          varying vec2 vLightmap;
          varying vec4 vColor;
          varying vec3 vNormal;
          varying vec3 vViewPos;

          void main() {
              vec4 tex = texture2D(texture, vTexcoord) * vColor;
              if (tex.a < 0.1) discard;
              vec3 albedo = toLinear(tex.rgb);
              float dist = length(vViewPos);
              float torch = clamp((vLightmap.x - 0.03125) / 0.9375, 0.0, 1.0);
              float held = max(float(heldBlockLightValue), float(heldBlockLightValue2)) / 15.0;
              torch = max(torch, max(0.0, held - dist / 14.0));

              float shade = 0.65 + 0.35 * (vNormal.y * 0.5 + 0.5);
              vec3 amb = vec3(0.20, 0.14, 0.32) * shade;
              vec3 light = amb + vec3(0.95, 0.65, 1.1) * pow(max(torch, 0.0001), 2.1) * 1.9;
              vec3 col = albedo * light;
              float fogF = smoothstep(far * 0.45, far * 0.98, dist);
              col = mix(col, vec3(0.05, 0.03, 0.09), fogF);
              gl_FragColor = vec4(toSRGB(filmicToneMap(col)), tex.a);
          }
          EOF

          cp pack/shaders/world-1/composite.vsh pack/shaders/world1/composite.vsh
          cp pack/shaders/world-1/composite.fsh pack/shaders/world1/composite.fsh
          cp pack/shaders/final.vsh pack/shaders/world1/final.vsh
          cp pack/shaders/final.fsh pack/shaders/world1/final.fsh

          cd pack
          zip -r ../LuminaLite-V4-Realista-1.20.1.zip shaders/
          cd ..

      - name: Salvar ZIP V4 na pagina inicial
        run: |
          rm -f LuminaLite-Realista-1.20.1.zip LuminaLite-V2-Realista-1.20.1.zip LuminaLite-V3-Otimizado-1.20.1.zip
          git config user.name "LuminaLite Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Shader LuminaLite V4 Realista e Otimizado 1.20.1"
            git push
          fi

      - name: Publicar ZIP V4 na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v4 LuminaLite-V4-Realista-1.20.1.zip --clobber || gh release create v4 LuminaLite-V4-Realista-1.20.1.zip --title "LuminaLite V4 Realista 1.20.1" --notes "Toque em LuminaLite-V4-Realista-1.20.1.zip para baixar e mova direto para shaderpacks!"
