name: Gerar Shader LuminaLite V3

on:
  push:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-shader:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar repositorio
        uses: actions/checkout@v4

      - name: Criar arquivos do shader LuminaLite V3 e gerar ZIP
        run: |
          rm -rf pack
          mkdir -p pack/shaders/lib pack/shaders/lang pack/shaders/world-1 pack/shaders/world1

          cat << 'EOF' > pack/shaders/shaders.properties
          shadow.enabled=true
          clouds=off
          oldLighting=false
          oldHandLight=true

          profile.BATATA = !SHADOWS GODRAYS REALISTIC_CLOUDS REALISTIC_WATER !BLOOM !WAVING_FOLIAGE VIBRANCE
          profile.SUPER_LEVE = SHADOWS shadowMapResolution=512 GODRAYS REALISTIC_CLOUDS REALISTIC_WATER BLOOM WAVING_FOLIAGE VIBRANCE
          profile.OTIMIZADO = SHADOWS shadowMapResolution=1024 GODRAYS REALISTIC_CLOUDS REALISTIC_WATER BLOOM WAVING_FOLIAGE VIBRANCE
          profile.ALTO = SHADOWS shadowMapResolution=2048 GODRAYS REALISTIC_CLOUDS REALISTIC_WATER BLOOM WAVING_FOLIAGE VIBRANCE

          screen = SHADOWS shadowMapResolution GODRAYS REALISTIC_CLOUDS REALISTIC_WATER BLOOM WAVING_FOLIAGE VIBRANCE
          EOF

          cat << 'EOF' > pack/shaders/lang/pt_BR.lang
          profile.BATATA=Celular Muito Fraco (Max FPS)
          profile.SUPER_LEVE=Super Leve (Celular/PC Fraco)
          profile.OTIMIZADO=Otimizado Realista (Padrao)
          profile.ALTO=Alto (Sombras Nitidas)
          option.SHADOWS=Sombras Realistas
          option.shadowMapResolution=Qualidade das Sombras
          value.shadowMapResolution.512=Baixa (Mais FPS)
          value.shadowMapResolution.1024=Media (Equilibrada)
          value.shadowMapResolution.2048=Alta (Nitida)
          option.GODRAYS=Feixes de Luz do Sol
          option.REALISTIC_CLOUDS=Nuvens Realistas
          option.REALISTIC_WATER=Agua Realista
          option.BLOOM=Brilho Suave (Bloom)
          option.WAVING_FOLIAGE=Vento nas Folhas e Grama
          option.VIBRANCE=Cores Vivas
          EOF

          cp pack/shaders/lang/pt_BR.lang pack/shaders/lang/en_US.lang

          cat << 'EOF' > pack/shaders/block.properties
          block.10001 = minecraft:water water
          block.10002 = minecraft:oak_leaves minecraft:spruce_leaves minecraft:birch_leaves minecraft:jungle_leaves minecraft:acacia_leaves minecraft:dark_oak_leaves minecraft:mangrove_leaves minecraft:cherry_leaves minecraft:azalea_leaves minecraft:flowering_azalea_leaves
          block.10003 = minecraft:grass minecraft:short_grass minecraft:tall_grass minecraft:fern minecraft:large_fern minecraft:dandelion minecraft:poppy minecraft:blue_orchid minecraft:allium minecraft:azure_bluet minecraft:red_tulip minecraft:orange_tulip minecraft:white_tulip minecraft:pink_tulip minecraft:oxeye_daisy minecraft:cornflower minecraft:lily_of_the_valley minecraft:wither_rose minecraft:sunflower minecraft:lilac minecraft:rose_bush minecraft:peony minecraft:pink_petals minecraft:wheat minecraft:carrots minecraft:potatoes minecraft:beetroots minecraft:sweet_berry_bush minecraft:sugar_cane minecraft:vine minecraft:glow_lichen minecraft:oak_sapling minecraft:spruce_sapling minecraft:birch_sapling minecraft:jungle_sapling minecraft:acacia_sapling minecraft:dark_oak_sapling minecraft:cherry_sapling minecraft:mangrove_propagule minecraft:seagrass minecraft:tall_seagrass minecraft:kelp minecraft:kelp_plant minecraft:dead_bush
          block.10004 = minecraft:torch minecraft:wall_torch minecraft:soul_torch minecraft:soul_wall_torch minecraft:lantern minecraft:soul_lantern minecraft:glowstone minecraft:sea_lantern minecraft:shroomlight minecraft:jack_o_lantern minecraft:ochre_froglight minecraft:verdant_froglight minecraft:pearlescent_froglight minecraft:campfire minecraft:soul_campfire minecraft:lava minecraft:magma_block minecraft:end_rod minecraft:beacon minecraft:redstone_lamp:lit=true minecraft:furnace:lit=true minecraft:blast_furnace:lit=true minecraft:smoker:lit=true minecraft:fire minecraft:soul_fire
          block.10005 = minecraft:diamond_ore minecraft:deepslate_diamond_ore minecraft:emerald_ore minecraft:deepslate_emerald_ore minecraft:gold_ore minecraft:deepslate_gold_ore minecraft:redstone_ore minecraft:deepslate_redstone_ore minecraft:lapis_ore minecraft:deepslate_lapis_ore minecraft:amethyst_cluster minecraft:crying_obsidian minecraft:respawn_anchor
          EOF

          cat << 'EOF' > pack/shaders/lib/settings.glsl
          #define SHADOWS
          #define GODRAYS
          #define REALISTIC_CLOUDS
          #define REALISTIC_WATER
          #define BLOOM
          #define WAVING_FOLIAGE
          #define VIBRANCE

          const int shadowMapResolution = 1024; // [512 1024 2048]
          const float shadowDistance = 64.0;
          const float shadowDistanceRenderMul = 1.0;
          const float shadowIntervalSize = 2.0;
          const float sunPathRotation = -30.0;
          const float ambientOcclusionLevel = 0.70;
          EOF

          cat << 'EOF' > pack/shaders/lib/common.glsl
          vec3 safeNormalize(vec3 v) {
              float l2 = dot(v, v);
              return (l2 > 0.000001) ? v * inversesqrt(l2) : vec3(0.0, 1.0, 0.0);
          }

          vec3 toLinear(vec3 c) {
              return pow(max(c, vec3(0.0001)), vec3(2.2));
          }

          vec3 toSRGB(vec3 c) {
              return pow(max(c, vec3(0.0001)), vec3(0.454545));
          }

          vec3 softToneMap(vec3 x) {
              x = max(x, vec3(0.0));
              return x / (x * 0.72 + vec3(0.88));
          }

          vec2 distortShadow(vec2 p) {
              return p / mix(1.0, length(p), 0.78);
          }

          float hash21(vec2 p) {
              p = fract(p * vec2(127.1, 311.7));
              p += dot(p, p + 34.53);
              return fract(p.x * p.y);
          }

          float smoothNoise(vec2 p) {
              vec2 i = floor(p);
              vec2 f = fract(p);
              f = f * f * (3.0 - 2.0 * f);
              float a = hash21(i);
              float b = hash21(i + vec2(1.0, 0.0));
              float c = hash21(i + vec2(0.0, 1.0));
              float d = hash21(i + vec2(1.0, 1.0));
              return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
          }

          float cloudNoise3(vec2 p) {
              float v = smoothNoise(p) * 0.55;
              p = p * 2.08 + vec2(5.2, 1.3);
              v += smoothNoise(p) * 0.30;
              p = p * 2.12 + vec2(1.7, 9.2);
              v += smoothNoise(p) * 0.15;
              return v;
          }

          float cloudNoise2(vec2 p) {
              return smoothNoise(p) * 0.65 + smoothNoise(p * 2.15 + vec2(4.1, 2.7)) * 0.35;
          }

          void getLightingPalette(float sunH, float rain, out vec3 skyTop, out vec3 skyHor, out vec3 directCol, out vec3 ambientCol) {
              float dayF = smoothstep(-0.08, 0.22, sunH);
              float setF = smoothstep(-0.14, 0.04, sunH) * (1.0 - smoothstep(0.04, 0.34, sunH));

              vec3 dayTop = vec3(0.05, 0.22, 0.68);
              vec3 dayHor = vec3(0.30, 0.56, 0.86);
              vec3 setTop = vec3(0.08, 0.14, 0.36);
              vec3 setHor = vec3(0.95, 0.32, 0.09);
              vec3 nitTop = vec3(0.008, 0.015, 0.042);
              vec3 nitHor = vec3(0.018, 0.032, 0.068);

              skyTop = mix(nitTop, dayTop, dayF);
              skyTop = mix(skyTop, setTop, setF * 0.85);
              skyHor = mix(nitHor, dayHor, dayF);
              skyHor = mix(skyHor, setHor, setF * 0.90);

              vec3 rainTop = mix(vec3(0.012, 0.016, 0.024), vec3(0.14, 0.17, 0.21), dayF);
              vec3 rainHor = mix(vec3(0.022, 0.026, 0.035), vec3(0.24, 0.27, 0.31), dayF);
              skyTop = mix(skyTop, rainTop, rain * 0.85);
              skyHor = mix(skyHor, rainHor, rain * 0.85);

              vec3 sunWarm = mix(vec3(1.35, 0.48, 0.14), vec3(1.25, 1.12, 0.92), smoothstep(0.0, 0.30, sunH));
              vec3 moonCool = vec3(0.14, 0.20, 0.32);
              directCol = (sunH >= 0.0) ? sunWarm : moonCool;
              directCol *= smoothstep(0.0, 0.10, abs(sunH));
              directCol *= (1.0 - rain * 0.78);

              vec3 dayAmb = vec3(0.22, 0.27, 0.34);
              vec3 setAmb = vec3(0.24, 0.17, 0.20);
              vec3 nitAmb = vec3(0.035, 0.048, 0.080);
              ambientCol = mix(nitAmb, dayAmb, dayF);
              ambientCol = mix(ambientCol, setAmb, setF * 0.80);
              ambientCol = mix(ambientCol, vec3(0.18, 0.20, 0.23) * max(dayF, 0.22), rain * 0.75);
          }

          vec3 computeSky(vec3 dir, vec3 sunDir, float time, float rain, float cloudQuality) {
              vec3 skyTop, skyHor, directCol, ambCol;
              getLightingPalette(sunDir.y, rain, skyTop, skyHor, directCol, ambCol);

              float up = clamp(dir.y, 0.0, 1.0);
              vec3 sky = mix(skyHor, skyTop, pow(max(up, 0.0001), 0.55));

              float down = clamp(-dir.y, 0.0, 1.0);
              sky = mix(sky, skyHor * 0.55, smoothstep(0.0, 0.35, down));

              float sunDot = max(dot(dir, sunDir), 0.0);
              float sunVis = smoothstep(-0.10, 0.06, sunDir.y) * (1.0 - rain * 0.90);
              vec3 sunGlow = mix(vec3(1.15, 0.38, 0.08), vec3(0.95, 0.82, 0.58), smoothstep(0.0, 0.32, sunDir.y));
              sky += sunGlow * pow(max(sunDot, 0.0001), 9.0) * 0.28 * sunVis;
              sky += sunGlow * pow(max(sunDot, 0.0001), 96.0) * 0.85 * sunVis;
              sky += vec3(1.8, 1.55, 1.15) * smoothstep(0.9982, 0.9994, sunDot) * sunVis;

              float moonDot = max(dot(dir, -sunDir), 0.0);
              float moonVis = (1.0 - smoothstep(-0.10, 0.06, sunDir.y)) * (1.0 - rain * 0.90);
              sky += vec3(0.18, 0.28, 0.48) * pow(max(moonDot, 0.0001), 22.0) * 0.30 * moonVis;
              sky += vec3(0.75, 0.85, 1.05) * smoothstep(0.9986, 0.9995, moonDot) * moonVis;

              if (cloudQuality > 0.5 && dir.y > 0.03) {
                  vec2 cUV = (dir.xz / (dir.y + 0.16)) * 1.4 + vec2(time * 0.012, time * 0.006);
                  float d = (cloudQuality > 1.5) ? cloudNoise3(cUV) : cloudNoise2(cUV);
                  float dSun = (cloudQuality > 1.5) ? cloudNoise2(cUV + sunDir.xz * 0.14) : d * 0.92;

                  float cov = mix(0.49, 0.30, rain);
                  float alpha = smoothstep(cov, cov + 0.24, d);

                  float dayF = smoothstep(-0.08, 0.22, sunDir.y);
                  float setF = smoothstep(-0.12, 0.04, sunDir.y) * (1.0 - smoothstep(0.04, 0.34, sunDir.y));
                  float shade = clamp((d - dSun) * 2.2 + 0.62, 0.20, 1.0);

                  vec3 cLit = mix(vec3(0.09, 0.13, 0.22), vec3(0.95, 0.94, 0.92), dayF);
                  cLit = mix(cLit, vec3(1.15, 0.46, 0.18), setF * 0.90);
                  cLit = mix(cLit, vec3(0.28, 0.30, 0.34) * max(dayF, 0.2), rain * 0.82);

                  vec3 cDark = mix(vec3(0.02, 0.03, 0.06), vec3(0.32, 0.40, 0.52), dayF);
                  cDark = mix(cDark, vec3(0.24, 0.15, 0.24), setF * 0.85);
                  cDark = mix(cDark, vec3(0.11, 0.13, 0.16) * max(dayF, 0.2), rain * 0.82);

                  vec3 cloudCol = mix(cDark, cLit, shade);
                  cloudCol += sunGlow * pow(max(sunDot, 0.0001), 10.0) * 0.28 * sunVis * (1.0 - alpha * 0.4);

                  float horFade = smoothstep(0.03, 0.24, dir.y);
                  sky = mix(sky, cloudCol, alpha * horFade * 0.88);
              }

              return sky;
          }

          vec3 getWaveOffset(vec3 absPos, float time, float rain, float strength) {
              float speed = 2.0 + rain * 1.6;
              float amp = (0.045 + rain * 0.04) * strength;
              float ph = absPos.x * 0.9 + absPos.z * 0.75 + absPos.y * 0.5;
              return vec3(sin(time * speed + ph) * amp, 0.0, cos(time * speed * 0.85 + ph * 1.1) * amp * 0.8);
          }
          EOF

          cat << 'EOF' > pack/shaders/shadow.vsh
          #version 120
          #include "/lib/settings.glsl"
          #include "/lib/common.glsl"

          attribute vec4 mc_Entity;
          uniform mat4 shadowModelView;
          uniform mat4 shadowModelViewInverse;
          uniform vec3 cameraPosition;
          uniform float frameTimeCounter;
          uniform float rainStrength;

          varying vec2 vTexcoord;

          void main() {
              vTexcoord = (gl_TextureMatrix[0] * gl_MultiTexCoord0).xy;
          #ifndef SHADOWS
              gl_Position = vec4(10.0, 10.0, 10.0, 1.0);
              return;
          #endif
              int blockId = int(mc_Entity.x + 0.5);
              if (blockId == 10001) {
                  gl_Position = vec4(10.0, 10.0, 10.0, 1.0);
                  return;
              }
              vec4 worldPos = shadowModelViewInverse * (gl_ModelViewMatrix * gl_Vertex);
          #ifdef WAVING_FOLIAGE
              if (blockId == 10002 || blockId == 10003) {
                  float str = (blockId == 10002) ? 0.65 : 1.0;
                  worldPos.xyz += getWaveOffset(worldPos.xyz + cameraPosition, frameTimeCounter, rainStrength, str);
              }
          #endif
              gl_Position = gl_ProjectionMatrix * (shadowModelView * worldPos);
              gl_Position.xy = distortShadow(gl_Position.xy);
              gl_Position.z *= 0.5;
          }
          EOF

          cat << 'EOF' > pack/shaders/shadow.fsh
          #version 120
          uniform sampler2D texture;
          varying vec2 vTexcoord;

          void main() {
              if (texture2D(texture, vTexcoord).a < 0.1) discard;
              gl_FragColor = vec4(1.0);
          }
          EOF

          cat << 'EOF' > pack/shaders/gbuffers_skybasic.vsh
          #version 120
          varying vec3 vViewPos;

          void main() {
              vec4 vp = gl_ModelViewMatrix * gl_Vertex;
              vViewPos = vp.xyz;
              gl_Position = gl_ProjectionMatrix * vp;
          }
          EOF

          cat << 'EOF' > pack/shaders/gbuffers_skybasic.fsh
          #version 120
          #include "/lib/settings.glsl"
          #include "/lib/common.glsl"

          /* DRAWBUFFERS:0 */
          uniform mat4 gbufferModelViewInverse;
          uniform vec3 sunPosition;
          uniform float rainStrength;
          uniform float frameTimeCounter;

          varying vec3 vViewPos;

          float hash31(vec3 p) {
              p = fract(p * 0.1031);
              p += dot(p, p.yzx + 33.33);
              return fract((p.x + p.y) * p.z);
          }

          void main() {
              vec3 worldDir = safeNormalize((gbufferModelViewInverse * vec4(vViewPos, 0.0)).xyz);
              vec3 sunDir = safeNormalize((gbufferModelViewInverse * vec4(sunPosition, 0.0)).xyz);

              float cloudQ = 0.0;
          #ifdef REALISTIC_CLOUDS
              cloudQ = 2.0;
          #endif

              vec3 col = computeSky(worldDir, sunDir, frameTimeCounter, rainStrength, cloudQ);

              float nightVis = (1.0 - smoothstep(-0.12, 0.05, sunDir.y)) * (1.0 - rainStrength);
              if (nightVis > 0.01 && worldDir.y > 0.02) {
                  vec3 grid = floor(worldDir * 220.0);
                  float rnd = hash31(grid);
                  if (rnd > 0.993) {
                      float twinkle = 0.6 + 0.4 * sin(frameTimeCounter * 2.6 + rnd * 600.0);
                      float hFade = smoothstep(0.02, 0.25, worldDir.y);
                      col += vec3(0.85, 0.92, 1.0) * twinkle * hFade * nightVis * 1.1;
                  }
              }

              col = toSRGB(softToneMap(col));
              gl_FragColor = vec4(col, 1.0);
          }
          EOF

          cat << 'EOF' > pack/shaders/gbuffers_skytextured.vsh
          #version 120
          varying vec2 vTexcoord;
          varying vec4 vColor;

          void main() {
              vTexcoord = (gl_TextureMatrix[0] * gl_MultiTexCoord0).xy;
              vColor = gl_Color;
              gl_Position = ftransform();
          }
          EOF

          cat << 'EOF' > pack/shaders/gbuffers_skytextured.fsh
          #version 120
          /* DRAWBUFFERS:0 */
          uniform sampler2D texture;
          uniform float rainStrength;
          varying vec2 vTexcoord;
          varying vec4 vColor;

          void main() {
              vec4 tex = texture2D(texture, vTexcoord) * vColor;
              tex.rgb *= (0.75 * (1.0 - rainStrength * 0.9));
              gl_FragColor = tex;
          }
          EOF

          cat << 'EOF' > pack/shaders/gbuffers_terrain.vsh
          #version 120
          #include "/lib/settings.glsl"
          #include "/lib/common.glsl"

          attribute vec4 mc_Entity;
          uniform mat4 gbufferModelView;
          uniform mat4 gbufferModelViewInverse;
          uniform mat4 shadowModelView;
          uniform mat4 shadowProjection;
          uniform vec3 cameraPosition;
          uniform float frameTimeCounter;
          uniform float rainStrength;

          varying vec2 vTexcoord;
          varying vec2 vLightmap;
          varying vec4 vColor;
          varying vec3 vWorldNormal;
          varying vec3 vViewPos;
          varying vec3 vWorldPos;
          varying vec3 vShadowClip;
          varying float vBlockType;

          void main() {
              vTexcoord = (gl_TextureMatrix[0] * gl_MultiTexCoord0).xy;
              vLightmap = (gl_TextureMatrix[1] * gl_MultiTexCoord1).xy;
              vColor = gl_Color;

              vec3 viewNormal = safeNormalize(gl_NormalMatrix * gl_Normal);
              vWorldNormal = safeNormalize(mat3(gbufferModelViewInverse) * viewNormal);

              vec4 viewPos = gl_ModelViewMatrix * gl_Vertex;
              vec4 worldPos = gbufferModelViewInverse * viewPos;

              int blockId = int(mc_Entity.x + 0.5);
              vBlockType = 0.0;
              if (blockId == 10002 || blockId == 10003) {
                  vBlockType = 1.0;
          #ifdef WAVING_FOLIAGE
                  float str = (blockId == 10002) ? 0.65 : 1.0;
                  worldPos.xyz += getWaveOffset(worldPos.xyz + cameraPosition, frameTimeCounter, rainStrength, str);
                  viewPos = gbufferModelView * worldPos;
          #endif
              } else if (blockId == 10004) {
                  vBlockType = 2.0;
              } else if (blockId == 10005) {
                  vBlockType = 3.0;
              }

              vViewPos = viewPos.xyz;
              vWorldPos = worldPos.xyz;

          #ifdef SHADOWS
              vec4 shWorld = vec4(worldPos.xyz + vWorldNormal * 0.07, 1.0);
              vec4 shClip = shadowProjection * (shadowModelView * shWorld);
              vShadowClip = shClip.xyz / max(abs(shClip.w), 0.0001);
          #else
              vShadowClip = vec3(0.0);
          #endif

              gl_Position = gl_ProjectionMatrix * viewPos;
          }
          EOF

          cat << 'EOF' > pack/shaders/gbuffers_terrain.fsh
          #version 120
          #include "/lib/settings.glsl"
          #include "/lib/common.glsl"

          /* DRAWBUFFERS:0 */
          uniform sampler2D texture;
          uniform sampler2D shadowtex0;
          uniform mat4 gbufferModelViewInverse;
          uniform vec3 sunPosition;
          uniform vec3 shadowLightPosition;
          uniform vec3 cameraPosition;
          uniform float frameTimeCounter;
          uniform float rainStrength;
          uniform int isEyeInWater;
          uniform float far;
          uniform float nightVision;
          uniform int heldBlockLightValue;
          uniform int heldBlockLightValue2;

          varying vec2 vTexcoord;
          varying vec2 vLightmap;
          varying vec4 vColor;
          varying vec3 vWorldNormal;
          varying vec3 vViewPos;
          varying vec3 vWorldPos;
          varying vec3 vShadowClip;
          varying float vBlockType;

          #ifdef SHADOWS
          float getShadow(vec3 sClip, float NdotL) {
              float edgeDist = max(abs(sClip.x), abs(sClip.y));
              if (edgeDist >= 0.995) return 1.0;
              vec2 uv = distortShadow(sClip.xy) * 0.5 + 0.5;
              float depth = (sClip.z * 0.5) * 0.5 + 0.5;
              if (depth <= 0.001 || depth >= 0.999) return 1.0;

              float bias = 0.0008 + 0.0016 * (1.0 - max(NdotL, 0.0));
              float off = 1.15 / float(shadowMapResolution);
              float lit = 0.0;
              lit += step(depth - bias, texture2D(shadowtex0, uv + vec2( off,  off)).r);
              lit += step(depth - bias, texture2D(shadowtex0, uv + vec2(-off,  off)).r);
              lit += step(depth - bias, texture2D(shadowtex0, uv + vec2( off, -off)).r);
              lit += step(depth - bias, texture2D(shadowtex0, uv + vec2(-off, -off)).r);
              lit *= 0.25;

              return mix(lit, 1.0, smoothstep(0.75, 0.99, edgeDist));
          }
          #endif

          void main() {
              vec4 tex = texture2D(texture, vTexcoord) * vColor;
              if (tex.a < 0.1) discard;

              vec3 albedo = toLinear(tex.rgb);
              vec3 N = safeNormalize(vWorldNormal);
              vec3 viewDir = safeNormalize(vWorldPos);
              vec3 sunDir = safeNormalize((gbufferModelViewInverse * vec4(sunPosition, 0.0)).xyz);
              vec3 lightDir = safeNormalize((gbufferModelViewInverse * vec4(shadowLightPosition, 0.0)).xyz);

              vec3 skyTop, skyHor, directCol, ambientCol;
              getLightingPalette(sunDir.y, rainStrength, skyTop, skyHor, directCol, ambientCol);

              float torchLight = clamp((vLightmap.x - 0.03125) / 0.9375, 0.0, 1.0);
              float skyLight = clamp((vLightmap.y - 0.03125) / 0.9375, 0.0, 1.0);
              float dist = length(vViewPos);

              float heldVal = max(float(heldBlockLightValue), float(heldBlockLightValue2)) / 15.0;
              torchLight = max(torchLight, max(0.0, heldVal - dist / 14.0));

              float isFoliage = float(vBlockType > 0.5 && vBlockType < 1.5);
              float isEmissive = float(vBlockType > 1.5 && vBlockType < 2.5);
              float isOre = float(vBlockType > 2.5);

              float NdotL = dot(N, lightDir);
              float diffuse = max(NdotL, 0.0);
              if (isFoliage > 0.5) {
                  diffuse = max(diffuse, 0.46);
              }

              float shadow = 1.0;
          #ifdef SHADOWS
              if (skyLight > 0.05 && (NdotL > 0.0 || isFoliage > 0.5)) {
                  shadow = getShadow(vShadowClip, NdotL);
              }
          #endif
              shadow *= smoothstep(0.04, 0.35, skyLight);

              float hemi = 0.65 + 0.35 * (N.y * 0.5 + 0.5);
              vec3 skyAmb = ambientCol * hemi * (skyLight * skyLight);
              vec3 caveAmb = vec3(0.022, 0.024, 0.028) + vec3(0.35) * nightVision;

              float torchCurve = pow(max(torchLight, 0.0001), 2.2) * 1.95;
              vec3 torchCol = vec3(1.0, 0.55, 0.20) * torchCurve;

              vec3 direct = directCol * diffuse * shadow;
              if (isFoliage > 0.5) {
                  float sss = pow(max(dot(viewDir, lightDir), 0.0001), 4.0);
                  direct += directCol * sss * 0.45 * shadow;
              }

              if (isEyeInWater == 1 && skyLight > 0.25 && diffuse > 0.0) {
                  vec3 absP = vWorldPos + cameraPosition;
                  float c1 = sin(absP.x * 1.8 + frameTimeCounter * 2.2) * cos(absP.z * 1.8 - frameTimeCounter * 1.6);
