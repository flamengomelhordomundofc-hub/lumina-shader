              vec3 light = amb + vec3(0.95, 0.65, 1.0) * pow(max(torch, 0.0001), 2.1) * 1.9;
              vec3 col = albedo * light;
              float fogF = smoothstep(far * 0.45, far * 0.98, dist);
              col = mix(col, vec3(0.05, 0.03, 0.09), fogF);
              gl_FragColor = vec4(linearToSRGB(acesToneMap(col)), tex.a);
          }
          EOF

          cp pack/shaders/world-1/final.vsh pack/shaders/world1/final.vsh
          cp pack/shaders/world-1/final.fsh pack/shaders/world1/final.fsh

          cd pack
          zip -r ../LuminaLite-Realista-1.20.1.zip shaders/
          cd ..

      - name: Salvar ZIP direto na pagina inicial
        run: |
          git config user.name "LuminaLite Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f LuminaLite-Realista-1.20.1.zip
          if ! git diff --staged --quiet; then
            git commit -m "Shader LuminaLite-Realista-1.20.1.zip pronto"
            git push
          fi

      - name: Publicar ZIP na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1 LuminaLite-Realista-1.20.1.zip --clobber || gh release create v1 LuminaLite-Realista-1.20.1.zip --title "LuminaLite Realista 1.20.1" --notes "Toque no arquivo LuminaLite-Realista-1.20.1.zip abaixo para baixar e mova direto para a pasta shaderpacks!"
