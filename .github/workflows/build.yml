              vColor = gl_Color;
              vNormal = safeNormalize(mat3(gbufferModelViewInverse) * (gl_NormalMatrix * gl_Normal));
              vec4 vp = gl_ModelViewMatrix * gl_Vertex;
              vViewPos = vp.xyz;
              gl_Position = gl_ProjectionMatrix * vp;
          }
          EOF

          cat << 'EOF' > pack/shaders/world-1/gbuffers_terrain.fsh
          #version 120
          #include "/lib/common.glsl"
          /* DRAWBUFFERS:0 */
          uniform sampler2D texture;
          uniform vec3 fogColor;
          uniform float far;
          uniform int heldBlockLightValue;
          uniform int heldBlockLightValue2;

          varying vec2 vTexcoord;
          varying vec2 vLightmap;
          varying vec4 vColor;
          varying vec3 vNormal;
          varying vec3 vViewPos;

          void main() {
              vec4 tex = texture2D(texture, vTexcoord) * vColor;
              if (tex.a < 0.1) discard;
              vec3 albedo = toLinear(tex.rgb);
              float dist = length(vViewPos);
              float torch = clamp((vLightmap.x - 0.03125) / 0.9375, 0.0, 1.0);
              float held = max(float(heldBlockLightValue), float(heldBlockLightValue2)) / 15.0;
              torch = max(torch, max(0.0, held - dist / 14.0));

              float shade = 0.70 + 0.30 * (vNormal.y * 0.5 + 0.5);
              vec3 amb = mix(vec3(0.24, 0.08, 0.04), toLinear(fogColor) * 0.85, 0.55) * shade;
              vec3 light = amb + vec3(1.2, 0.52, 0.18) * pow(max(torch, 0.0001), 2.1) * 2.1;
              vec3 col = albedo * light;
              float fogF = smoothstep(far * 0.25, far * 0.92, dist);
              col = mix(col, toLinear(fogColor) * 0.65, fogF);
              gl_FragColor = vec4(toSRGB(softToneMap(col)), tex.a);
          }
          EOF

          cp pack/shaders/final.vsh pack/shaders/world-1/final.vsh
          cat << 'EOF' > pack/shaders/world-1/final.fsh
          #version 120
          uniform sampler2D colortex0;
          varying vec2 vTexcoord;
          void main() {
              vec3 c = texture2D(colortex0, vTexcoord).rgb;
              vec2 p = vTexcoord - vec2(0.5);
              c *= clamp(1.0 - dot(p, p) * 0.35, 0.78, 1.0);
              gl_FragColor = vec4(c, 1.0);
          }
          EOF

          cp pack/shaders/world-1/gbuffers_terrain.vsh pack/shaders/world1/gbuffers_terrain.vsh
          cat << 'EOF' > pack/shaders/world1/gbuffers_terrain.fsh
          #version 120
          #include "/lib/common.glsl"
          /* DRAWBUFFERS:0 */
          uniform sampler2D texture;
          uniform float far;
          uniform int heldBlockLightValue;
          uniform int heldBlockLightValue2;

          varying vec2 vTexcoord;
          varying vec2 vLightmap;
          varying vec4 vColor;
          varying vec3 vNormal;
          varying vec3 vViewPos;

          void main() {
              vec4 tex = texture2D(texture, vTexcoord) * vColor;
              if (tex.a < 0.1) discard;
              vec3 albedo = toLinear(tex.rgb);
              float dist = length(vViewPos);
              float torch = clamp((vLightmap.x - 0.03125) / 0.9375, 0.0, 1.0);
              float held = max(float(heldBlockLightValue), float(heldBlockLightValue2)) / 15.0;
              torch = max(torch, max(0.0, held - dist / 14.0));

              float shade = 0.65 + 0.35 * (vNormal.y * 0.5 + 0.5);
              vec3 amb = vec3(0.20, 0.14, 0.32) * shade;
              vec3 light = amb + vec3(0.95, 0.65, 1.1) * pow(max(torch, 0.0001), 2.1) * 1.9;
              vec3 col = albedo * light;
              float fogF = smoothstep(far * 0.45, far * 0.98, dist);
              col = mix(col, vec3(0.05, 0.03, 0.09), fogF);
              gl_FragColor = vec4(toSRGB(softToneMap(col)), tex.a);
          }
          EOF

          cp pack/shaders/world-1/final.vsh pack/shaders/world1/final.vsh
          cp pack/shaders/world-1/final.fsh pack/shaders/world1/final.fsh

          cd pack
          zip -r ../LuminaLite-V3-Otimizado-1.20.1.zip shaders/
          cd ..

      - name: Salvar ZIP V3 na pagina inicial
        run: |
          rm -f LuminaLite-Realista-1.20.1.zip LuminaLite-V2-Realista-1.20.1.zip
          git config user.name "LuminaLite Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Shader LuminaLite V3 Otimizado e Corrigido 1.20.1"
            git push
          fi

      - name: Publicar ZIP V3 na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v3 LuminaLite-V3-Otimizado-1.20.1.zip --clobber || gh release create v3 LuminaLite-V3-Otimizado-1.20.1.zip --title "LuminaLite V3 Otimizado 1.20.1" --notes "Toque em LuminaLite-V3-Otimizado-1.20.1.zip para baixar e mova direto para shaderpacks!"
